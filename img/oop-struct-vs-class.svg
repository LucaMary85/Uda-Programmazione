<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160">
  <rect x="0" y="0" width="220" height="160" fill="#ffffff"/>
  <!-- struct: dati dentro, funzione fuori -->
  <text x="50" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5b6478" font-weight="bold">struct</text>
  <rect x="14" y="24" width="72" height="46" rx="5" fill="none" stroke="#5b6478" stroke-width="2.5"/>
  <text x="50" y="43" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5b6478">titolo</text>
  <text x="50" y="57" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5b6478">autore</text>
  <rect x="20" y="86" width="60" height="22" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3"/>
  <text x="50" y="101" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#b45309">stampaScheda()</text>
  <line x1="50" y1="70" x2="50" y2="86" stroke="#5b6478" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- class: dati e metodo insieme -->
  <text x="164" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2540a8" font-weight="bold">class</text>
  <rect x="122" y="24" width="84" height="90" rx="5" fill="none" stroke="#3454d1" stroke-width="2.5"/>
  <text x="164" y="43" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2540a8">titolo</text>
  <text x="164" y="57" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2540a8">autore</text>
  <rect x="132" y="70" width="64" height="30" rx="4" fill="#3454d1"/>
  <text x="164" y="89" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffffff">stampaScheda()</text>

  <text x="110" y="60" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5b6478">&#8594;</text>
  <text x="110" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5b6478">stesso comportamento, dentro o fuori dalla scatola</text>
</svg>
