<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150">
  <rect x="0" y="0" width="220" height="150" fill="#ffffff"/>
  <!-- programma al centro -->
  <rect x="80" y="45" width="60" height="60" rx="6" fill="none" stroke="#2540a8" stroke-width="3"/>
  <text x="110" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2540a8">programma</text>

  <!-- cin: entra da sinistra -->
  <line x1="10" y1="55" x2="78" y2="55" stroke="#16a34a" stroke-width="6"/>
  <polygon points="78,49 92,55 78,61" fill="#16a34a"/>
  <text x="44" y="42" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#16a34a" font-weight="bold">cin &gt;&gt;</text>

  <!-- cout: esce a destra -->
  <line x1="142" y1="95" x2="196" y2="95" stroke="#f59e0b" stroke-width="6"/>
  <polygon points="196,89 210,95 196,101" fill="#f59e0b"/>
  <text x="176" y="118" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#b45309" font-weight="bold">cout &lt;&lt;</text>

  <text x="18" y="25" font-family="sans-serif" font-size="9" fill="#5b6478">tastiera</text>
  <text x="168" y="132" font-family="sans-serif" font-size="9" fill="#5b6478">schermo</text>
</svg>
