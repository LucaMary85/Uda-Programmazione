<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" width="220" height="160">
  <rect x="0" y="0" width="220" height="160" fill="#ffffff"/>
  <!-- char: piccola scatolina -->
  <rect x="8" y="118" width="26" height="26" rx="3" fill="none" stroke="#3454d1" stroke-width="3"/>
  <text x="21" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#5b6478">char</text>
  <!-- bool: interruttore -->
  <rect x="46" y="112" width="20" height="32" rx="10" fill="none" stroke="#3454d1" stroke-width="3"/>
  <circle cx="56" cy="120" r="6" fill="#16a34a"/>
  <text x="56" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#5b6478">bool</text>
  <!-- int: scatola media -->
  <rect x="80" y="96" width="42" height="48" rx="3" fill="none" stroke="#3454d1" stroke-width="3"/>
  <text x="101" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#5b6478">int</text>
  <!-- double: scatola grande -->
  <rect x="134" y="70" width="54" height="74" rx="3" fill="none" stroke="#3454d1" stroke-width="3"/>
  <text x="161" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#5b6478">double</text>
  <!-- string: cassetto allungato in alto -->
  <rect x="8" y="18" width="180" height="26" rx="4" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="98" y="35" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6478">string = "ciao"</text>
</svg>
