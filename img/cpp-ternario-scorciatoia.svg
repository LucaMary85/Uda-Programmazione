<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150">
  <rect x="0" y="0" width="220" height="150" fill="#ffffff"/>
  <!-- if/else esteso -->
  <rect x="14" y="14" width="192" height="60" rx="6" fill="none" stroke="#5b6478" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="110" y="34" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6478">if (cond)</text>
  <text x="110" y="50" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6478">A; else</text>
  <text x="110" y="66" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5b6478">B;</text>

  <text x="110" y="94" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3454d1">&#8595;</text>

  <!-- ternario compresso -->
  <rect x="30" y="102" width="160" height="34" rx="6" fill="#3454d1"/>
  <text x="110" y="124" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#ffffff">cond ? A : B</text>
</svg>
