<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150">
  <rect x="0" y="0" width="220" height="150" fill="#ffffff"/>
  <!-- classe madre -->
  <rect x="70" y="14" width="80" height="34" rx="6" fill="#3454d1"/>
  <text x="110" y="36" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#ffffff" font-weight="bold">Persona</text>
  <text x="110" y="60" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#5b6478">nome, cognome, saluta()</text>

  <!-- linea di discendenza -->
  <line x1="110" y1="48" x2="110" y2="90" stroke="#5b6478" stroke-width="2.5"/>
  <polygon points="102,88 110,100 118,88" fill="#5b6478"/>

  <!-- classe figlia -->
  <rect x="60" y="100" width="100" height="34" rx="6" fill="#16a34a"/>
  <text x="110" y="122" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#ffffff" font-weight="bold">Studente</text>
  <text x="110" y="146" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#166534">+ classe, override saluta()</text>
</svg>
